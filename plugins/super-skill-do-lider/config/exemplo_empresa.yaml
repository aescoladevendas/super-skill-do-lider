# ----------------------------------------------------------------------------
# 21. DIAGNÓSTICO DE REDE (skill diagnostico-de-rede)
# ----------------------------------------------------------------------------
diagnostico_rede:
  # [TENANT] rótulo curto da empresa nos cabeçalhos do Excel ("Empresa jan-ago 26").
  # Sem esta chave, vale meta.empresa.
  rotulo_empresa: "Empresa"

  # [TENANT] marcas parecidas com as da empresa (ou que já foram dela) mas que NÃO
  # entram no recorte: contam como mercado. A empresa é só produtos.marcas_foco.
  marcas_fora_da_empresa: ["Marca V"]

  # [TENANT] categorias de outra unidade de negócio que vêm junto no export e saem
  # de todas as tabelas de categoria
  categorias_fora_da_unidade: ["Cuidados Pessoais"]

  # [ENGINE] como o portal agrega a concorrência quando a rede não libera as marcas
  # concorrentes em detalhe (sem marca concorrente aberta, a aba CONCORRÊNCIA não sai)
  rotulos_concorrencia_agregada: ["OUTRA MARCA", "OUTROS PRODUTOS"]

  # [TENANT] nome das métricas no export de KPIs por SKU do painel de varejo
  metricas_export:
    valor: "Vendas em valor R$"
    quantidade: "Quantidade de venda"
    lojas: "Qtd Lojas"

  # [TENANT] layout do export de abertura por loja: colunas de dimensão antes das
  # semanas e posição de cada métrica dentro do bloco de cada semana (0 = 1ª coluna)
  abertura_lojas:
    colunas_dimensao: 7          # loja, endereço, categoria, fabricante, marca, EAN, SKU
    metricas_por_semana: 5       # preço médio, valor, kg, quantidade, % participação
    posicao_valor: 1
    posicao_quantidade: 3

  # [TENANT] trecho do nome ou do endereço da loja → UF, para quando nem o nome nem o
  # endereço terminam com a sigla do estado. Ex.: { "CIDADE NORTE": "TO" }.
  # A prioridade é: uf_map.json da rede > sigla no fim do nome/endereço > este mapa.
  uf_por_trecho: {}

  # [TENANT] categoria em perda de share → frente e ação que entram no PLANO DE AÇÃO.
  # Categoria fora deste mapa recebe a ação genérica (sortimento, preço, execução).
  acoes_por_categoria:
    "Limpador Multiuso":
      frente: "Multiuso"
      acao: "Marca X Multiuso: defender o preço de entrada do 500 ml e do 750 ml, ponto extra e sortimento por loja"
    "Limpador Perfumado":
      frente: "Perfumado"
      acao: "Marca X Perfumado: revisar sortimento de fragrâncias e preço por loja"
    "Desengordurante":
      frente: "Desengordurante"
      acao: "Marca X Cozinha: reposicionar preço e embalagem (refil e squeeze) onde o mercado da rede cresce e a empresa cai"
    "Alvejantes":
      frente: "Marca Y"
      acao: "Recuperar Marca Y: revisar sortimento de pó e gel por loja, preço de prateleira e ponto extra na área de lavanderia"
    "Limpador Sanitário":
      frente: "Marca Z"
      acao: "Marca Z: revisar sortimento e preço por loja e ponto extra no corredor de banheiro"
    "Desodorizador Sanitário":
      frente: "Marca Z"
      acao: "Marca Z: revisar sortimento e preço por loja e ponto extra no corredor de banheiro"
    "Detergente Lava Louça em Po":
      frente: "Marca W"
      acao: "Marca W pó: garantir presença em todas as lojas e destravar tabletes e abrilhantador onde a categoria cresce"
    "Detergente Lava Louça Tabletes":
      frente: "Marca W"
      acao: "Marca W tabletes: presença e preço de prateleira nas lojas onde a categoria cresce"

  # [ENGINE] limiares do método (padrão em LIMIARES_PADRAO do montar_diagnostico.py).
  # Só preencha para mudar a regra; ex.: { loja_movimento: 0.08 }.
  limiares: {}

  # [ENGINE] subpasta, dentro da pasta do cliente (caminhos.clientes/<cliente>), onde
  # ficam os dados brutos do período (CSVs, uf_map.json e cubos)
  subpasta_dados: "_dados_painel_varejo_{periodo}"

# ----------------------------------------------------------------------------
# 22. PLANO DE NEGÓCIOS COM O CLIENTE (skill plano-de-negocios-com-cliente)
# ----------------------------------------------------------------------------
plano_de_negocios:
  # [TENANT] onde o deck é entregue: dentro da pasta compartilhada do time e dentro
  # da pasta do cliente
  subpasta_compartilhada: "05. Planos de Negocio - Clientes Estrategicos"   # em caminhos.compartilhada
  subpasta_cliente: "Plano_de_Negocios"                                      # em caminhos.clientes/<cliente>
  # [TENANT] cor do chip do cliente quando o roteiro não traz a cor da marca dele
  cor_cliente_padrao: "#2E6E8E"
  # [ENGINE] texto fixo do rodapé (o nome do cliente e da empresa entram depois)
  rotulo_rodape: "Diagnóstico Executivo Sell Out"
  # [ENGINE] linha de grade dos gráficos e borda dos cards quando o padrao-visual não define
  cor_grade: "#EDF1F5"
  cor_linha: "#E5E5EA"
